<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HufiBoss</title>
<link rel="stylesheet" href="/static/app.css" />
<link rel="stylesheet" href="/static/agents.css" />
<link rel="stylesheet" href="/static/chat.css" />
<link rel="stylesheet" href="/static/org-canvas.css" />
<link rel="stylesheet" href="/static/cards.css" />
<link rel="stylesheet" href="/static/work.css" />
<link rel="stylesheet" href="/static/rooms.css" />
<link rel="stylesheet" href="/static/credentials.css" />
</head>
<body>
  <div id="root" class="root" data-active-view="hufi">
    <nav id="primaryNav" class="primary-nav" aria-label="Hauptnavigation">
      <button class="primary-nav__item" data-view="hufi" type="button" aria-current="page">
        <span class="primary-nav__label">HufiBoss</span>
      </button>
      <button class="primary-nav__item" data-view="firma" type="button">
        <span class="primary-nav__label">Team / Firma</span>
      </button>
      <button class="primary-nav__item" data-view="projekte" type="button">
        <span class="primary-nav__label">Projekte</span>
      </button>
      <button class="primary-nav__item" data-view="routinen" type="button">
        <span class="primary-nav__label">Routinen</span>
      </button>
      <button class="primary-nav__item" data-view="arbeit" type="button">
        <span class="primary-nav__label">Arbeit / Verlauf</span>
      </button>
    </nav>

    <div id="topbar" class="topbar">
      <button id="sidebarToggle" class="icon-btn" aria-label="Menü öffnen">☰</button>
      <span id="topbarTitle" class="topbar-title">HufiBoss</span>
      <button id="rightpaneToggle" class="icon-btn" aria-label="Details öffnen">ⓘ</button>
    </div>

    <div id="shell" class="shell">
      <aside id="sidebar" class="sidebar" aria-label="Digitale Firma">
        <div class="sidebar-header">
          <div class="brand">HufiBoss</div>
          <button id="newHufiBtn" class="btn btn--ghost btn--sm">+ Neuer Hufi</button>
        </div>
        <div class="sidebar-search">
          <input id="sidebarSearch" type="search" placeholder="Suchen…" autocomplete="off" />
        </div>
        <div class="sidebar-section-label">Aktive Bereiche</div>
        <nav id="sidebarList" class="sidebar-list">
          <p class="empty-hint">Lädt …</p>
        </nav>
        <div class="sidebar-footer">
          <span id="connStatus" class="conn-status"></span>
          <button id="logoutBtn" class="btn btn--ghost btn--sm">Abmelden</button>
        </div>
      </aside>
      <div id="sidebarScrim" class="scrim"></div>

      <main id="viewport" class="viewport">
        <section id="view-hufi" class="view" data-view="hufi">
          <div id="chat" class="chat">
            <p class="empty-hint">Lädt …</p>
          </div>
        </section>
        <section id="view-firma" class="view" data-view="firma" hidden>
          <p class="empty-hint">Lädt …</p>
        </section>
        <section id="view-projekte" class="view" data-view="projekte" hidden>
          <p class="empty-hint">Lädt …</p>
        </section>
        <section id="view-routinen" class="view" data-view="routinen" hidden>
          <p class="empty-hint">Lädt …</p>
        </section>
        <section id="view-arbeit" class="view" data-view="arbeit" hidden>
          <p class="empty-hint">Lädt …</p>
        </section>
      </main>

      <aside id="rightpane" class="rightpane" aria-label="Kontext">
        <div class="rightpane-header">
          <span id="rightpaneTitle">Kontext</span>
          <button id="rightpaneClose" class="icon-btn" aria-label="Schließen">✕</button>
        </div>
        <div id="rightpaneContent" class="rightpane-content">
          <p class="empty-hint">Wähle einen Hufi, um Details zu sehen.</p>
        </div>
      </aside>
      <div id="rightpaneScrim" class="scrim"></div>
    </div>
  </div>

<script src="/static/app.js"></script>
<script src="/static/nav.js"></script>
<script src="/static/org-data.js"></script>
<script src="/static/agents.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/org-canvas.js"></script>
<script src="/static/cards.js"></script>
<script src="/static/work.js"></script>
<script src="/static/rooms.js"></script>
<script src="/static/credentials.js"></script>
</body>
</html>
