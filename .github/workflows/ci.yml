name: core
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
      # Phase 3A's sandbox/credential boundary (hufiagents/tools/sandbox.py)
      # fails closed without Bubblewrap, and its project_argv() hardcodes a
      # NodeSource-layout Node.js (/usr/bin/node, /usr/lib/node_modules/npm)
      # -- the same runtime the dev/reference environment uses. Ubuntu's own
      # nodejs/npm apt packages use a different layout and are not enough.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y --no-install-recommends nodejs
          # Ubuntu 24.04's AppArmor policy lets an unprivileged user namespace
          # be created but then denies it CAP_NET_ADMIN, so bwrap's --unshare-net
          # (project_argv's untrusted-code network isolation) fails bringing up
          # loopback ("Failed RTM_NEWADDR: Operation not permitted"). Relaxing
          # this AppArmor restriction is the standard workaround for running
          # bwrap in CI; confined to this ephemeral runner VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          HUFI_DEFAULT_PROVIDER: fake
