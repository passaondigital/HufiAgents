[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hufiagents"
version = "1.4.0a1"
description = "Local-first, auditable mission execution core"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    "playwright>=1.62.0",
]

[project.scripts]
hufiagents = "hufiagents.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "pytest-timeout>=2.3,<3", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
